name: Server Health Check

on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check CPU, memory, disk
        uses: appleboy/ssh-action@v1          # Pre-built action that handles the SSH key setup
        with:
          host: ${{ secrets.SERVER_HOST }}       # Server IP or hostname
          username: ${{ secrets.SERVER_USER }}   # Login user
          key: ${{ secrets.SSH_PRIVATE_KEY }}    # Private key from secrets
          script: |
            uptime      # CPU load
            free -h     # Memory
            df -h /     # Disk
